name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The real-data tests skip without data/raw/, so fetch it once and cache it.
      - name: Cache SECOM raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: secom-raw-${{ hashFiles('scripts/00_fetch_data.py') }}

      - name: Fetch SECOM
        run: python scripts/00_fetch_data.py

      - name: Run tests
        run: pytest -q
