[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secom-process-control"
version = "1.0.0"
description = "Production test monitoring and process control analysis on the UCI SECOM fab dataset"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "statistical-process-control",
    "spc",
    "cusum",
    "semiconductor",
    "manufacturing",
    "secom",
    "power-bi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/syedwajiulhassan715-rgb/semiconductor-process-control"
Report = "https://github.com/syedwajiulhassan715-rgb/semiconductor-process-control/blob/main/reports/ENGINEERING_REPORT.md"
Dataset = "https://doi.org/10.24432/C54305"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = [
    "E741",  # `l`/`I` names are conventional in the stats formulas
]

[tool.ruff.lint.per-file-ignores]
# run_analysis.py puts src/ on sys.path before importing secom
"scripts/run_analysis.py" = ["E402"]
