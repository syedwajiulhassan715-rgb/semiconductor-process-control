# Install once with:  pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Generated outputs are excluded: they must stay byte-identical to what
      # `secom run` writes.
      - id: trailing-whitespace
        exclude: ^(data/|reports/results\.json$|reports/figures/)
      - id: end-of-file-fixer
        exclude: ^(data/|reports/results\.json$|reports/figures/)
      - id: check-yaml
        # mkdocs.yml uses !!python/name tags; check syntax without constructing them
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=8000"]  # fact_measurement.csv is ~6.6 MB by design

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
